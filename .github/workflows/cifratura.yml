name: Cifratura Automatica Dizionario

on:
  push:
    paths:
      - 'dizionario_in_chiaro.txt' # Si attiva solo quando modifichi questo file

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Permette a GitHub di salvare i file generati nel tuo repo

    steps:
    - name: Controlla il codice del repository
      uses: actions/checkout@v4

    - name: Imposta Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Esegui Cifratura XOR e Aggiorna Versione
      run: |
        python -c '
        import os

        chiave = "LaMiaChiaveDizionario".encode("utf-8")
        file_in = "dizionario_in_chiaro.txt"
        file_out = "dizionario_protetto.txt"

        # 1. Cifratura XOR
        if os.path.exists(file_in):
            with open(file_in, "r", encoding="utf-8") as f:
                testo = f.read()
            
            byte_in = testo.encode("utf-8")
            byte_out = bytearray()
            
            for i in range(len(byte_in)):
                byte_out.append(byte_in[i] ^ chiave[i % len(chiave)])
                
            with open(file_out, "wb") as f:
                f.write(byte_out)
            print("Cifratura completata.")
        else:
            print("Errore: dizionario_in_chiaro.txt non trovato.")

        # 2. Aggiornamento incrementale di version.txt
        versione_corrente = 1
        if os.path.exists("version.txt"):
            with open("version.txt", "r", encoding="utf-8") as f:
                contenuto = f.read().strip()
                if contenuto.isdigit():
                    versione_corrente = int(contenuto)
        
        nuova_versione = versione_corrente + 1
        with open("version.txt", "w", encoding="utf-8") as f:
            f.write(str(nuova_versione))
        print(f"Versione aggiornata a: {nuova_versione}")
        '

    - name: Commit e Push dei file generati
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@://github.com"
        git add dizionario_protetto.txt version.txt
        # Esegue il push solo se ci sono reali modifiche per evitare loop infiniti
        git diff-index --quiet HEAD || git commit -m "Automazione: Aggiornato dizionario protetto e versione"
        git push
